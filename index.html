<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f3f6fa" />
    <meta
      name="description"
      content="Solecraft — демонстрационный магазин городских кроссовок с понятной посадкой."
    />
    <link rel="icon" href="/brand-mark.svg" type="image/svg+xml" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="ru_RU" />
    <meta property="og:title" content="Solecraft — городские кроссовки" />
    <meta
      property="og:description"
      content="Выбирайте городские кроссовки по ширине, амортизации и поддержке."
    />
    <meta property="og:image" content="/social-card.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Solecraft — городские кроссовки" />
    <meta
      name="twitter:description"
      content="Выбирайте городские кроссовки по ширине, амортизации и поддержке."
    />
    <meta name="twitter:image" content="/social-card.png" />
    <style>
      #solecraft-boot {
        box-sizing: border-box;
        position: absolute;
        inset: 0 0 auto;
        z-index: 0;
        min-height: 100vh;
        width: 100%;
        max-width: 100vw;
        padding: 0 16px;
        color: #171c26;
        background: #f3f6fa;
        font-family: Arial, sans-serif;
        overflow: clip;
        contain: paint;
      }

      #solecraft-boot header {
        display: flex;
        align-items: center;
        height: 72px;
        border-bottom: 1px solid #cbd2dc;
        font-weight: 800;
        letter-spacing: 0.08em;
      }

      #solecraft-boot main {
        max-width: 1180px;
        margin: 0 auto;
        padding-top: 46px;
      }

      #solecraft-boot small {
        color: #355cff;
        font-weight: 800;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      #solecraft-boot h1 {
        max-width: 760px;
        margin: 14px 0 18px;
        font-size: clamp(42px, 9vw, 76px);
        line-height: 0.98;
        letter-spacing: -0.045em;
      }

      #solecraft-boot p {
        max-width: 660px;
        margin: 0 0 24px;
        font-size: 20px;
        font-weight: 600;
        line-height: 1.5;
      }

      #solecraft-boot a {
        display: inline-flex;
        min-height: 44px;
        align-items: center;
        padding: 0 20px;
        color: #fff;
        background: #355cff;
        font-weight: 800;
        text-decoration: none;
      }

      #app-root {
        position: relative;
        z-index: 1;
      }
    </style>
    <title>Solecraft — городские кроссовки</title>
  </head>
  <body>
    <div id="root">
      <div id="solecraft-boot">
        <header>Solecraft</header>
        <main>
          <small>Посадка / город / движение</small>
          <h1>Твой город.<br />Твоя посадка.</h1>
          <p>
            Solecraft помогает выбирать кроссовки по ширине, амортизации и поддержке —
            чтобы вид совпадал с тем, как вы двигаетесь каждый день.
          </p>
          <a href="/catalog">Подобрать пару</a>
        </main>
      </div>
      <div id="app-root"></div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
